# Keeps the SHA-pinned actions up to date. Dependabot rewrites both the SHA and the "# vX.Y.Z" comment.
# A 7-day cooldown means a just-published (possibly hijacked) release is never pulled in on day one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    ignore:
      # 4.4.0 runs a new game-ci CLI that passes customParameters with their quotes, so -assemblyNames matched nothing and
      # every EditMode group ran 0 tests (PR #611); it also posts a check run the job has no permission for. Revisit with 4.5.
      - dependency-name: game-ci/unity-test-runner
        versions: [">= 4.4.0, < 4.5.0"]
