# Checks for every pull request and every push to main. Required to pass before merging (rulesets on dev and main).
# - Workflow lint: actionlint (syntax) + zizmor (Actions security audit).
# - Secret scan: gitleaks over the commits being checked (GitHub secret scanning also runs on every push).
# - Sim tests: dotnet test Tools/SimTests (pure-C# sim, no Unity, no secrets; runs on fork PRs too).
# - Unity tests (2026-11-11, the user's call): EditMode via GameCI, only on PRs into main (the gate) and on a manual run,
#   never for a docs-only diff; four assembly groups run in parallel and the "Unity tests" job (the required check) gates them.
#   PRs into dev rely on the local batched Editor pass (docs/workflow.md section 7) plus the fast checks; pushes to main skip it
#   (the PR into main already tested that content). Needs the Unity license secrets, so it is skipped for PRs from forks
#   (GitHub never gives secrets to fork PRs; don't change this to pull_request_target).
# Setup and rationale: docs/ci.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: AquariumCiv

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: low

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        env:
          # Only the new commits: the PR's commits, or the pushed range. Full history was scanned when the repo went public.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          range="--all"
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="$BASE..$HEAD"
          fi
          echo "Scanning $range"
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --log-opts="$range"

  # The pure-C# sim tests outside Unity (Tools/SimTests, docs/workflow.md sim lane). No license, no secrets.
  # ~4-10 min as of 2026-11-10 (1721 tests); a 10 min cap cancelled a green run on PR #534.
  sim-tests:
    name: Sim tests (dotnet)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('Tools/SimTests/*.csproj') }}
          restore-keys: nuget-

      - name: dotnet test
        run: dotnet test Tools/SimTests

  # Does this run need Unity at all? Only a PR into main (or a manual run), and only when something other than docs changed.
  unity-scope:
    name: Unity scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          run=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            run=true
          elif [ "$EVENT" = "pull_request" ] && [ "$BASE_REF" = "main" ] && [ "$SAME_REPO" = "true" ]; then
            if git diff --name-only "$BASE...$HEAD" | grep -qvE '^docs/|\.md$'; then run=true; fi
          fi
          echo "Unity tests needed: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  unity-editmode:
    name: Unity EditMode (${{ matrix.group }})
    needs: unity-scope
    if: needs.unity-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: sim
            assemblies: AquariumCiv.Sim.Tests
          - group: life
            assemblies: AquariumCiv.Life.Tests
          - group: view
            assemblies: AquariumCiv.View.Tests
          - group: rest
            assemblies: AquariumCiv.Audio.Tests;AquariumCiv.Game.UI.Tests;AquariumCiv.Cards.Tests;AquariumCiv.Moments.Tests;AquariumCiv.Shaping.Tests;AquariumCiv.ShowMe.Tests;AquariumCiv.TimeLapseScreen.Tests;AquariumCiv.Prototypes.Shared.Tests;AquariumCiv.Spikes.Growth.Tests;AquariumCiv.View.PlayTests;AquariumCiv.Game.UI.PlayTests;AquariumCiv.Prototypes.Shared.PlayTests
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache LFS objects so every run doesn't burn LFS bandwidth.
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('AquariumCiv/Assets/**', 'AquariumCiv/Packages/**', 'AquariumCiv/ProjectSettings/**') }}
          restore-keys: Library-test-

      - name: EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          testMode: editmode
          # -assemblyNames counts as an explicit selection, so Unity would also run every [Explicit] test in those assemblies
          # (the 200-seed sweeps timed out on PR #586): on-demand tests carry Category("OnDemand") and are left out here.
          customParameters: -assemblyNames "${{ matrix.assemblies }}" -testCategory "!OnDemand"
          artifactsPath: test-results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ matrix.group }}
          path: test-results
          retention-days: 14

  # The required check (rulesets on dev and main): green when the EditMode groups passed, or were not needed (unity-scope).
  unity-tests:
    name: Unity tests
    needs: [unity-scope, unity-editmode]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Gate
        env:
          SCOPE: ${{ needs.unity-scope.result }}
          NEEDED: ${{ needs.unity-scope.outputs.run }}
          EDITMODE: ${{ needs.unity-editmode.result }}
        run: |
          echo "scope=$SCOPE needed=$NEEDED editmode=$EDITMODE"
          if [ "$SCOPE" != "success" ]; then echo "Unity scope did not run cleanly"; exit 1; fi
          if [ "$NEEDED" != "true" ]; then echo "Unity tests not needed for this run (PR into dev, push, or docs only)."; exit 0; fi
          if [ "$EDITMODE" = "success" ]; then exit 0; fi
          echo "EditMode groups: $EDITMODE"; exit 1
