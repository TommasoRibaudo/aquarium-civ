# Build the Unity project for iOS and upload it to TestFlight. No Mac needed:
# 1. Linux: GameCI exports the Xcode project (Unity Personal license from secrets).
# 2. macOS: Xcode archives with cloud-managed signing (App Store Connect API key) and uploads to App Store Connect.
# Setup and secrets: docs/testflight.md
name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's in this build (shown in the run name)"
        required: false
        default: ""

run-name: "TestFlight #${{ github.run_number }} ${{ inputs.notes }}"

permissions: {}

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  PROJECT_PATH: AquariumCiv
  BUILD_NAME: AquariumCiv

jobs:
  export:
    name: Export Xcode project (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          for s in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do [ -z "${!s}" ] && missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "::error::Missing repo secrets:$missing (see docs/testflight.md)"; exit 1; fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cache LFS objects so every build doesn't burn LFS bandwidth.
      - name: List LFS objects
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Pull LFS objects
        run: git lfs pull

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-iOS-${{ hashFiles('AquariumCiv/Assets/**', 'AquariumCiv/Packages/**', 'AquariumCiv/ProjectSettings/**') }}
          restore-keys: Library-iOS-

      # Feedback goes to GitHub issues (docs/feedback.md). The token is a fine-grained PAT limited to this repo's
      # issues; it is written into the build only, never committed. Missing secret = feedback waits in the outbox.
      - name: Bake feedback token and build info
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          dir="${{ env.PROJECT_PATH }}/Assets/Prototypes/_Shared/Resources"
          mkdir -p "$dir"
          printf '%s' "$FEEDBACK_TOKEN" > "$dir/FeedbackToken.txt"
          printf '%s' "build ${{ github.run_number }} (${GITHUB_SHA::7})" > "$dir/BuildInfo.txt"
          [ -n "$FEEDBACK_TOKEN" ] || echo "::warning::FEEDBACK_TOKEN secret not set: in-app feedback will only be saved on the device"

      - name: Unity build (iOS export)
        uses: game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45 # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          targetPlatform: iOS
          buildName: ${{ env.BUILD_NAME }}
          versioning: None

      # Tar first: artifacts drop the executable bits that Unity's Xcode build scripts need.
      - name: Pack Xcode project
        run: sudo tar -czf ios-xcode.tgz -C build/iOS "$BUILD_NAME"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcode
          path: ios-xcode.tgz
          retention-days: 1
          compression-level: 0

  testflight:
    name: Archive, sign and upload (macOS)
    needs: export
    runs-on: macos-26
    timeout-minutes: 60
    # The environment only allows main, so a TestFlight upload always comes from reviewed, merged code.
    environment: testflight
    permissions:
      actions: write # delete the intermediate Xcode artifact
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    # Secrets are passed per step, so third-party actions in this job never see them.
    steps:
      - name: Check secrets
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for s in APPSTORE_KEY_ID APPSTORE_ISSUER_ID APPSTORE_P8 APPLE_TEAM_ID; do [ -z "${!s}" ] && missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing (see docs/testflight.md)"; exit 1; fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-xcode

      - name: Unpack
        run: |
          mkdir -p xcode
          tar -xzf ios-xcode.tgz -C xcode
          echo "XCODE_DIR=$PWD/xcode/$BUILD_NAME" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        run: |
          XCODE=""
          for x in /Applications/Xcode_26*.app; do
            case "$x" in *[Bb]eta*) continue ;; esac
            XCODE="$x"  # glob order is sorted, so the last match is the newest
          done
          [ -n "$XCODE" ] || { echo "::error::No Xcode 26 on this runner"; exit 1; }
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install API key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          KEY_DIR="$RUNNER_TEMP/keys"
          echo "KEY_DIR=$KEY_DIR" >> "$GITHUB_ENV"
          mkdir -p "$KEY_DIR"
          umask 077
          printf '%s\n' "$APPSTORE_P8" > "$KEY_DIR/AuthKey_$APPSTORE_KEY_ID.p8"

      - name: Stamp build number and export compliance
        run: |
          PLIST="$XCODE_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"             || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" -c "Print :CFBundleVersion" "$PLIST"

      - name: Archive
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive             -project "$XCODE_DIR/Unity-iPhone.xcodeproj" -scheme Unity-iPhone -configuration Release             -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AquariumCiv.xcarchive"             -allowProvisioningUpdates -authenticationKeyPath "$KEY_DIR/AuthKey_$APPSTORE_KEY_ID.p8"             -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic -quiet

      - name: Export and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AquariumCiv.xcarchive"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"             -allowProvisioningUpdates -authenticationKeyPath "$KEY_DIR/AuthKey_$APPSTORE_KEY_ID.p8"             -authenticationKeyID "$APPSTORE_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          echo "### Uploaded build $BUILD_NUMBER to App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "It shows up in TestFlight after Apple finishes processing (usually 5-30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      - name: Delete Xcode artifact
        if: always()
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: ios-xcode
